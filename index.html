<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"><title>Todo List</title><script defer="defer" src="main.js"></script></head><body><aside class="sidebar"><div class="title"><svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>notebook-outline</title><path d="M17,4V10L15,8L13,10V4H9V20H19V4H17M3,7V5H5V4C5,2.89 5.9,2 7,2H19C20.05,2 21,2.95 21,4V20C21,21.05 20.05,22 19,22H7C5.95,22 5,21.05 5,20V19H3V17H5V13H3V11H5V7H3M5,5V7H7V5H5M5,19H7V17H5V19M5,13H7V11H5V13Z"/></svg><h1 class="app-title">Todo List</h1></div><div class="default"><button class="list" id="inbox"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>inbox</title><path d="M19,15H15A3,3 0 0,1 12,18A3,3 0 0,1 9,15H5V5H19M19,3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3Z"/></svg> Inbox</button></div><div class="divider"></div><div class="lists-header"><h3>Lists</h3><button class="new-list">+</button></div><div class="lists"></div></aside><div class="content"><h1 class="list-title">Inbox</h1><div class="add-task"><button class="new-task-plus">+</button> <input name="new-task" id="new-task" placeholder="New Task"></div><div class="tasks"></div></div><form class="task-sidebar"><h2 class="sidebar-task-name" contenteditable="true">Task Name</h2><div class="description"><label for="description">Description</label> <textarea name="description" id="description" placeholder="Enter description..."></textarea></div><div class="notes"><label for="notes">Notes</label> <textarea name="notes" id="notes" placeholder="Enter notes..."></textarea></div><div class="due-date"><label for="due-date">Due Date</label> <input type="
